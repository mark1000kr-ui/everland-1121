<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<title>원직모 에버랜드 위치공유 맵</title>
<meta property="og:title" content="원직모 에버랜드 위치공유 맵">
<meta property="og:description" content="놀이기구 공포지수 0~10 · 지도 · 일행 실시간 위치">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg:#0d1117; --glass:rgba(18,22,30,.62); --glass2:rgba(255,255,255,.08); --edge:rgba(255,255,255,.14);
  --txt:#f4f5f7; --mute:#a3a9b6; --hot:#ff4d3d; --warm:#ff8a3d; --mid:#ffc43d; --cool:#3ddc97; --calm:#5aa9ff;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif; overflow:hidden; }
button { font-family:inherit; color:inherit; cursor:pointer; }
#map { position:fixed; inset:0; z-index:0; background:#1a1f27; }
.glass { background:var(--glass); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); border:1px solid var(--edge); box-shadow:0 10px 30px rgba(0,0,0,.35); }

/* 상단 */
.top { position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:10px; right:10px; z-index:500; display:flex; gap:8px; align-items:stretch; }
.brand { flex:1; border-radius:20px; padding:10px 14px; display:flex; flex-direction:column; justify-content:center; }
.brand b { font-size:12px; letter-spacing:.22em; color:var(--mute); font-weight:700; }
.brand span { font-size:19px; font-weight:800; letter-spacing:-.02em; margin-top:1px; }
.wxchip { border-radius:20px; padding:8px 12px; min-width:84px; text-align:center; display:flex; flex-direction:column; justify-content:center; }
.wxchip b { font-size:22px; font-weight:800; line-height:1; } .wxchip small { font-size:11px; color:var(--mute); margin-top:3px; }
.crew { position:fixed; top:calc(84px + env(safe-area-inset-top,0px)); left:10px; right:10px; z-index:500; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.crew::-webkit-scrollbar { display:none; }
.crew .p { flex:none; border-radius:999px; padding:5px 10px 5px 5px; display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
.crew .p i { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:11px; color:#0d1117; }
.crew .p small { color:var(--mute); font-weight:500; }

/* 지도 위 버튼 */
.fabs { position:fixed; right:12px; bottom:calc(96px + var(--safe-b)); z-index:500; display:flex; flex-direction:column; gap:10px; }
.fab { width:52px; height:52px; border-radius:18px; font-size:22px; display:flex; align-items:center; justify-content:center; border:1px solid var(--edge); }
.fab.share { width:auto; padding:0 18px; font-size:15px; font-weight:800; gap:8px; background:linear-gradient(135deg,#ff6a3d,#ff3d6e); border:0; color:#fff; box-shadow:0 10px 26px rgba(255,61,110,.45); }
.fab.share.live { background:linear-gradient(135deg,#1fd18b,#0fa3a3); box-shadow:0 10px 26px rgba(15,163,163,.5); }
.fab.share .dot { width:9px; height:9px; border-radius:50%; background:#fff; }
.fab.share.live .dot { animation:pulse 1.4s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)} 100%{box-shadow:0 0 0 12px rgba(255,255,255,0)} }

/* 아래 탭 */
.tabs { position:fixed; left:10px; right:10px; bottom:calc(10px + var(--safe-b)); z-index:700; border-radius:24px; display:grid; grid-template-columns:repeat(5,1fr); padding:6px; }
.tabs button { background:none; border:0; border-radius:18px; padding:8px 0 6px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11.5px; font-weight:700; color:var(--mute); }
.tabs button span { font-size:20px; filter:grayscale(.6); }
.tabs button.on { background:var(--glass2); color:var(--txt); } .tabs button.on span { filter:none; }

/* 시트 */
.sheet { position:fixed; left:0; right:0; bottom:0; top:calc(70px + env(safe-area-inset-top,0px)); z-index:600; border-radius:28px 28px 0 0; transform:translateY(105%); transition:transform .38s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; background:rgba(13,17,23,.84); }
.sheet.open { transform:none; }
.sheet .grab { width:44px; height:5px; border-radius:3px; background:rgba(255,255,255,.25); margin:10px auto 4px; }
.sheet .scroll { overflow-y:auto; padding:6px 14px calc(110px + var(--safe-b)); -webkit-overflow-scrolling:touch; }
.sheet h2 { font-size:24px; font-weight:800; letter-spacing:-.03em; margin:8px 2px 4px; }
.sheet .lead { color:var(--mute); font-size:13.5px; margin:0 2px 12px; line-height:1.5; }

.chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chips button { flex:none; border:1px solid var(--edge); background:var(--glass2); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700; color:var(--mute); }
.chips button.on { background:var(--txt); color:var(--bg); border-color:var(--txt); }

.ride { position:relative; border-radius:20px; padding:14px 14px 14px 16px; margin-bottom:10px; background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); border:1px solid var(--edge); overflow:hidden; }
.ride::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c); }
.ride .row { display:flex; align-items:flex-start; gap:12px; }
.ride .nm { flex:1; } .ride h3 { margin:0; font-size:18px; font-weight:800; letter-spacing:-.02em; }
.ride .zone { font-size:12px; color:var(--mute); margin-top:2px; }
.ride .num { text-align:right; } .ride .num b { font-size:34px; font-weight:900; letter-spacing:-.04em; color:var(--c); line-height:1; font-variant-numeric:tabular-nums; }
.ride .num small { display:block; font-size:11px; color:var(--mute); font-weight:700; margin-top:2px; }
.meter { height:8px; border-radius:6px; background:rgba(255,255,255,.08); margin:10px 0 8px; overflow:hidden; }
.meter i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,#5aa9ff,#3ddc97 30%,#ffc43d 55%,#ff8a3d 72%,#ff4d3d); background-size:calc(100% * 10 / var(--s)) 100%; width:calc(var(--s) * 10%); }
.ride p { margin:0; font-size:13.5px; color:#cfd3db; line-height:1.5; }
.tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
.tags span { font-size:11.5px; padding:3px 8px; border-radius:7px; background:rgba(255,255,255,.07); color:#d6d9e0; }
.ride .done { position:absolute; right:12px; bottom:12px; border:1px solid var(--edge); background:var(--glass2); border-radius:999px; padding:5px 11px; font-size:12px; font-weight:800; color:var(--mute); }
.ride.rode { opacity:.5; } .ride.rode .done { background:var(--cool); color:#08281c; border-color:var(--cool); }
.ride .go { position:absolute; right:12px; bottom:12px; margin-right:84px; border:1px solid var(--edge); background:var(--glass2); border-radius:999px; padding:5px 11px; font-size:12px; font-weight:800; color:var(--mute); }

.card { border-radius:20px; padding:16px; margin-bottom:10px; background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); border:1px solid var(--edge); }
.card h3 { margin:0 0 4px; font-size:17px; font-weight:800; } .card .max { font-size:12px; color:var(--mute); font-weight:700; }
.steps { margin:10px 0 0; padding:0; list-style:none; counter-reset:s; }
.steps li { counter-increment:s; position:relative; padding:0 0 10px 34px; font-size:14.5px; line-height:1.45; }
.steps li::before { content:counter(s); position:absolute; left:0; top:0; width:24px; height:24px; border-radius:8px; background:var(--glass2); border:1px solid var(--edge); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.wx { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.wx div { flex:none; width:62px; text-align:center; padding:10px 0; border-radius:14px; background:var(--glass2); font-size:12px; color:var(--mute); }
.wx div b { display:block; font-size:18px; color:var(--txt); margin:2px 0; }
.list { margin:6px 0 0; padding-left:18px; font-size:14.5px; line-height:1.7; color:#dfe2e8; }
.note { font-size:12px; color:var(--mute); line-height:1.55; margin:8px 2px; }

/* 지도 핀: 어두운 알약 말풍선, 점수는 색 글자, 아래 꼬리로 위치 표시 */
.pin { position:relative; display:inline-flex; align-items:center; gap:6px; transform:translate(-50%,calc(-100% - 7px)); white-space:nowrap;
  background:rgba(13,17,23,.88); border:1px solid rgba(255,255,255,.18); border-radius:4px; padding:4px 8px 4px 6px; box-shadow:0 6px 16px rgba(0,0,0,.35); }
.pin::after { content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); border:6px solid transparent; border-bottom:0; border-top-color:rgba(13,17,23,.88); }
.pin::before { content:""; width:4px; align-self:stretch; border-radius:1px; background:var(--c); }
.pin b { font-size:13px; font-weight:900; color:var(--c); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.pin span { font-size:12px; font-weight:700; color:#fff; }
.dot { width:11px; height:11px; border-radius:2px; background:var(--c); border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4); transform:translate(-50%,-50%); }
.person { transform:translate(-17px,-17px); }
.person b { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; color:#0d1117; border:3px solid #fff; box-shadow:0 0 0 6px rgba(61,220,151,.25), 0 6px 16px rgba(0,0,0,.45); }
.person span { position:absolute; top:38px; left:50%; transform:translateX(-50%); font-size:12px; font-weight:800; color:#fff; background:rgba(13,17,23,.8); padding:2px 7px; border-radius:7px; white-space:nowrap; }
.flag { font-size:30px; transform:translate(-8px,-30px); filter:drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
.leaflet-control-attribution { background:rgba(13,17,23,.6)!important; color:#9aa!important; font-size:9px; } .leaflet-control-attribution a { color:#9aa!important; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background:rgba(18,22,30,.95); color:var(--txt); border-radius:14px; }
.mem { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; margin-bottom:8px; background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); border:1px solid var(--edge); }
.mem i { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:900; color:#0d1117; flex:none; }
.mem .nm { flex:1; font-size:16px; font-weight:800; } .mem .nm small { display:block; font-size:12px; color:var(--mute); font-weight:600; margin-top:1px; }
.mem.off i { filter:grayscale(1) brightness(.6); }
.st { font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; background:var(--glass2); color:var(--mute); border:0; }
.st.on { background:rgba(61,220,151,.18); color:var(--cool); }
.me-row { display:flex; gap:10px; align-items:center; padding:14px; border-radius:18px; margin:0 0 14px; background:linear-gradient(135deg, rgba(255,106,61,.18), rgba(255,61,110,.12)); border:1px solid rgba(255,120,120,.35); }
.me-row .nm { flex:1; font-size:15px; font-weight:800; } .me-row .nm small { display:block; color:var(--mute); font-size:12px; font-weight:600; }
.sw { width:58px; height:34px; border-radius:999px; background:rgba(255,255,255,.18); border:0; position:relative; flex:none; transition:.25s; }
.sw::after { content:""; position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:50%; background:#fff; transition:.25s; }
.sw.on { background:var(--cool); } .sw.on::after { left:28px; }
.pick { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 14px; }
.pick button { border:1px solid var(--edge); background:var(--glass2); border-radius:14px; padding:12px 4px; font-size:14px; font-weight:800; }

.place { display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:16px; margin-bottom:8px; background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); border:1px solid var(--edge); }
.place .ic { width:40px; height:40px; border-radius:12px; background:var(--glass2); display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
.place .nm { flex:1; font-size:16px; font-weight:800; } .place .nm small { display:block; font-size:12px; color:var(--mute); font-weight:600; margin-top:1px; }
.place .dir { text-align:center; min-width:54px; } .place .dir b { display:block; font-size:20px; line-height:1; transition:transform .3s; }
.place .dir small { font-size:11.5px; color:var(--mute); font-weight:700; }
.navgo { border:0; border-radius:12px; padding:9px 12px; font-size:13px; font-weight:800; color:#fff; background:linear-gradient(135deg,#2f80ff,#5a5cff); }
.navbar { position:fixed; left:10px; right:10px; top:calc(84px + env(safe-area-inset-top,0px)); z-index:650; border-radius:22px; padding:12px 14px; display:none; align-items:center; gap:14px; }
.navbar.on { display:flex; }
.navbar .arrow { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#2f80ff,#5a5cff); display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 8px 20px rgba(47,128,255,.45); }
.navbar .arrow svg { width:34px; height:34px; transition:transform .25s; }
.navbar .info { flex:1; } .navbar .info b { display:block; font-size:24px; font-weight:900; letter-spacing:-.02em; } .navbar .info small { color:var(--mute); font-size:13px; font-weight:700; }
.navbar .x { border:1px solid var(--edge); background:var(--glass2); border-radius:12px; padding:8px 11px; font-size:13px; font-weight:800; }
.navbar .cmp { display:block; font-size:11.5px; color:var(--mute); margin-top:2px; }
.poi.grp { width:auto; padding:0 6px; gap:3px; } .poi.grp b { font-size:11px; color:#fff; }
.poi { width:24px; height:24px; border-radius:7px; background:rgba(13,17,23,.78); border:1px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:13px; transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.3); }
.toast { position:fixed; left:50%; top:calc(140px + env(safe-area-inset-top,0px)); transform:translateX(-50%) translateY(-20px); opacity:0; z-index:900; border-radius:14px; padding:10px 16px; font-size:14px; font-weight:700; transition:.3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand glass"><b>EVERLAND · 11.21</b><span>원직모 에버랜드 위치공유 맵</span></div>
  <div class="wxchip glass" id="wxchip"><b>--°</b><small>지금 기온</small></div>
</div>
<div class="crew" id="crew"></div>

<div class="fabs">
  <button class="fab glass" id="locate" title="내 위치">🎯</button>
  <button class="fab glass" id="fit" title="일행 모두 보기">👥</button>
  <button class="fab glass" id="meet" title="모임장소">🚩</button>
  <button class="fab share" id="share"><span class="dot"></span><span id="shareTxt">위치 공유</span></button>
</div>

<section class="sheet glass" id="sheet"><div class="grab"></div><div class="scroll" id="sheetBody"></div></section>

<nav class="tabs glass">
  <button data-t="map" class="on"><span>🗺️</span>지도</button>
  <button data-t="rides"><span>🎢</span>공포지수</button>
  <button data-t="eat"><span>🍔</span>먹고쉬기</button>
  <button data-t="crewtab"><span>👥</span>일행</button>
  <button data-t="tips"><span>🌡️</span>날씨</button>
</nav>
<div class="navbar glass" id="navbar"><div class="arrow" id="navArrow"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l7 18-7-4-7 4z"/></svg></div><div class="info"><small id="navTo"></small><b id="navDist"></b><span class="cmp" id="navCmp"></span></div><button class="x" id="navX">종료</button></div>
<div class="toast glass" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 공포지수: 높이·낙하·회전·속도·체감(무서움) 종합한 주관 평가. pos 는 OpenStreetMap 에서 위치가 확인된 것만.
const RIDES = [
  { n:'T익스프레스', s:9.6, z:'유러피언 어드벤처', h:'130~195cm', tag:['나무 롤러코스터','77도 낙하','최고 104km/h'], d:'56m에서 77도로 떨어지는 국내 대표 우든코스터. 에어타임 연속.', pos:[37.28982,127.20248] },
  { n:'휴먼스카이', s:8.9, z:'에버랜드 상공', h:'키 제한 확인', tag:['유료','자유낙하 스윙'], d:'높이 끌어올려 줄을 놓으면 진자처럼 떨어지는 스카이코스터형. 별도 요금.', pos:[37.29306,127.20438] },
  { n:'더블락스핀', s:8.3, z:'아메리칸 어드벤처', h:'키 제한 확인', tag:['360도 회전','거꾸로'], d:'공중에서 계속 뒤집힘. 멀미 약하면 비추.' },
  { n:'블러드시티(호러)', s:8.0, z:'시즌 이벤트', h:'-', tag:['호러','11/22까지 예정'], d:'가을 호러 시즌 공간. 운영 시간·입장 방식은 앱 확인.' },
  { n:'롤링엑스트레인', s:7.6, z:'아메리칸 어드벤처', h:'키 제한 확인', tag:['루프 2회','코스터'], d:'360도 루프가 있는 스틸 코스터. 짧고 강함.' },
  { n:'허리케인', s:7.0, z:'아메리칸 어드벤처', h:'키 제한 확인', tag:['회전','원심력'], d:'빙글빙글 + 상하 움직임. 어지러움 주의.' },
  { n:'렛츠트위스트', s:6.8, z:'아메리칸 어드벤처', h:'키 제한 확인', tag:['공중 회전'], d:'원판에 앉아 높이 들려 비틀어 돔.' },
  { n:'썬더폴스', s:6.4, z:'아메리칸 어드벤처', h:'키 제한 확인', tag:['💦 젖음','20m 낙하'], d:'보트 타고 20m 낙하 + 백드롭. 추운 날 젖으면 고생 — 우비 추천. 저온 시 운휴 가능.' },
  { n:'콜럼버스 대탐험', s:6.0, z:'아메리칸 어드벤처', h:'키 제한 확인', tag:['바이킹'], d:'대형 바이킹. 맨 끝자리가 제일 무서움.' },

    const p = { name: me, lat:+pos.coords.latitude.toFixed(5), lon:+pos.coords.longitude.toFixed(5), t: Date.now() };
    if (admin && !near(p.lat, p.lon)) {   // 관리자 본인: 에버랜드 밖이면 위치는 안 보내고 '밖'이라고만 알림(한 번)
      if (!awayNoted) { awayNoted = true; const o = { name: me, off: true, away: true, t: Date.now() }; upsert(o); send(o); toast('에버랜드 근처에 오면 내 위치가 공유돼요 🙈'); }
      return;
    }
    awayNoted = false; upsert(p); if (Date.now() - last > 30000) { last = Date.now(); send(p); }
  }, () => { toast('위치 권한을 허용해 주세요'); sharing = false; localStorage.setItem('sharing', '0'); setShareUI(); }, { enableHighAccuracy:true, maximumAge:15000 });
  setShareUI(); if (!resume) toast('내 위치가 일행에게 공유돼요 📍 끄려면 일행 탭 스위치');
}
$('share').onclick = () => toggleShare();
// 내 위치 점: 공유 여부·에버랜드 안팎과 상관없이 내 화면에만 항상 표시(보내지 않음). 2026-11-21 대표님: "지도에 내 위치 표시가 안되는듯"
let myDot = null, myRing = null, myFirst = true;
if (navigator.geolocation) navigator.geolocation.watchPosition(pos => {
  const ll = [pos.coords.latitude, pos.coords.longitude], acc = Math.min(pos.coords.accuracy || 30, 200);
  if (!myDot) {
    myRing = L.circle(ll, { radius: acc, color:'#2f80ff', weight:1, fillColor:'#2f80ff', fillOpacity:.12, interactive:false }).addTo(map);
    myDot = L.circleMarker(ll, { radius:8, color:'#fff', weight:3, fillColor:'#2f80ff', fillOpacity:1 }).addTo(map).bindTooltip('나', { direction:'top' });
  } else { myDot.setLatLng(ll); myRing.setLatLng(ll).setRadius(acc); }
  if (myFirst && near(ll[0], ll[1])) { myFirst = false; map.flyTo(ll, 17, { duration:.8 }); }
}, () => toast('위치 권한을 허용하면 지도에 내 위치가 보여요'), { enableHighAccuracy:true, maximumAge:10000 });
// 다시 열었을 때: 전에 켜 두었으면 자동으로 이어서 공유
// 기본값은 공유 켜짐(2026-11-20 대표님: '기본값은 위치 켜기임'). 직접 끈 사람만 꺼진 채로 둔다. 이름이 없으면 일행 탭을 열어 이름부터 고르게 한다
if (TOPIC) { if (!me) setTimeout(() => openTab('crewtab'), 600); else if (localStorage.getItem('sharing') !== '0') toggleShare(true); }
$('meet').onclick = () => {
  if (!TOPIC) return toast('단톡방 링크로 들어와야 해요');
  const c = map.getCenter();
  if (confirm('지도 가운데를 모임장소로 찍어 일행에게 알릴까요?')) { const p = { type:'meet', name: me || '누군가', lat:+c.lat.toFixed(5), lon:+c.lng.toFixed(5), t: Date.now() }; upsert(p); send(p); }
};
$('locate').onclick = () => myDot ? map.flyTo(myDot.getLatLng(), 18, { duration:.7 }) : toast('위치를 찾는 중이에요… 권한을 허용해 주세요');
$('fit').onclick = () => { const pts = Object.values(people).map(p => [p.lat,p.lon]); pts.length ? map.flyToBounds(pts, { padding:[90,90], maxZoom:17 }) : (map.flyTo([37.2918,127.2025],16), toast('아직 공유 중인 일행이 없어요')); };

// ── 먹고쉬기 + 길안내 ─────────────────────────────────────────────
// 구역 위치(대략): 공식 지도 구역 기준. 정확한 매장 위치는 아님
const Z = { 글로벌페어:[37.2936,127.2046], 유러피안:[37.2907,127.2040], 매직랜드:[37.2926,127.1994], 아메리칸:[37.2930,127.2012], 주토피아:[37.2921,127.2064] };
const jit = (z, i) => [Z[z][0] + ((i * 37) % 9 - 4) * 0.00012, Z[z][1] + ((i * 53) % 9 - 4) * 0.00016];
const PLACES = [
  // 식사(공식 '레스토랑' 중 식사 매장) — 시간은 10/28(수) 공식 기준
  { n:'포메인', k:'🍜', t:'쌀국수·볶음밥 · 1.3만~', h:'10:00~21:30', z:'유러피안', i:1 },
  { n:'차이나문', k:'🥟', t:'자장면·짬뽕 · 1.4만', h:'11:30~20:40', z:'유러피안', i:2 },
  { n:'매직타임 레스토랑', k:'🍲', t:'한식·중식 · 1.6만~', h:'11:30~20:30', z:'유러피안', i:3 },
  { n:'버거카페 유럽', k:'🍔', t:'버거 세트 · 1.4만~', h:'11:30~20:00', z:'유러피안', i:4 },
  { n:'슬로우야드 바베큐', k:'🍖', t:'바비큐 플래터 · 4.2만~', h:'12:00~21:00', z:'유러피안', i:5 },
  { n:'가든 테라스', k:'🍛', t:'카레·폭립 · 1.4만~', h:'11:30~20:15', z:'유러피안', i:6 },
  { n:'알파인 레스토랑', k:'🍚', t:'김치찌개 반상·돈가스 · 1.9만~', h:'11:30~17:30', z:'유러피안', i:7 },
  { n:'알프스 쿠체', k:'🍢', t:'우동·돈가스커리 · 1.5만~', h:'11:30~19:00', z:'유러피안', i:8 },
  { n:'홀랜드 빌리지', k:'🍕', t:'피자 콤보 · 2.9만', h:'12:00~21:50', z:'유러피안', i:9 },
  { n:'시마스시', k:'🍣', t:'회전초밥 · 접시 5천', h:'11:00~21:00', z:'글로벌페어', i:1 },
  { n:'오리엔탈 스테이션', k:'🍜', t:'우동·라멘 · 1.3만~', h:'12:10~21:00', z:'글로벌페어', i:2 },
  { n:'온더보더', k:'🌮', t:'타코·화이타 · 6.5천~', h:'10:30~21:00', z:'글로벌페어', i:3 },
  { n:'한와담 소반', k:'🥘', t:'불고기·만두전골 · 2.1만~', h:'11:00~20:30', z:'글로벌페어', i:4 },
  { n:'맘스터치', k:'🍔', t:'싸이버거 · 6.9천~', h:'10:30~22:00', z:'매직랜드', i:1 },
  { n:'타운즈 마켓 레스토랑', k:'🍱', t:'소바·정식 · 1.7만~', h:'11:30~19:00', z:'매직랜드', i:2 },
  { n:'카페 정글캠프', k:'🥩', t:'스테이크 콤보 · 3.6만~', h:'11:00~19:30', z:'주토피아', i:1 },
  { n:'KFC', k:'🍗', t:'치킨·버거 · 3천~', h:'10:30~22:00', pos:[37.29267,127.20152] },
  // 간식·편의
  { n:'씨제이 핫도그·팝콘', k:'🌭', t:'간식', pos:[37.29303,127.20162] },
  { n:'앤티앤스 프레즐', k:'🥨', t:'간식', pos:[37.29151,127.20031] },
  { n:'CU 편의점', k:'🏪', t:'편의점·핫팩·음료', pos:[37.29427,127.205] },
  { n:'화장실(포시즌스가든 쪽)', k:'🚻', t:'화장실', pos:[37.29068,127.20325] },
  { n:'화장실(주토피아 쪽)', k:'🚻', t:'화장실', pos:[37.29339,127.20661] },
].map(p => p.pos ? p : { ...p, pos: Z[p.z], approx: true });
const placeLayer = L.layerGroup().addTo(map);
// 지도가 가려지지 않게 먹고쉬기 핀은 작은 아이콘만, 누르면 이름과 길안내(2026-11-21 대표님: "다가려서 멤버위치 안보일듯")
// 정확한 좌표가 있는 곳만 아이콘으로. 구역만 아는 식당은 지그재그로 흩뿌리지 않고 구역 한가운데 묶음 핀 하나로(2026-11-21 대표님: "이런 기이한배치가 실제로 그래?")
const popNav = (title, sub, target) => { const d = document.createElement('div'); d.innerHTML = `<b>${title}</b><br><small>${sub}</small><br>`; const b = document.createElement('button'); b.className = 'navgo'; b.style.marginTop = '6px'; b.textContent = '길안내'; b.onclick = () => { map.closePopup(); startNav(target); }; d.append(b); return d; };
PLACES.filter(pl => !pl.approx).forEach(pl => L.marker(pl.pos, { icon: L.divIcon({ className:'', html:`<div class="poi">${pl.k}</div>`, iconSize:[0,0] }), zIndexOffset:-500 })
  .bindPopup(() => popNav(pl.n, pl.t + (pl.h ? ' · ' + pl.h : ''), pl)).addTo(placeLayer));
const ZN = { 글로벌페어:'글로벌페어', 유러피안:'유러피안 어드벤처', 매직랜드:'매직랜드', 아메리칸:'아메리칸 어드벤처', 주토피아:'주토피아' };
Object.keys(Z).forEach(z => {
  const list = PLACES.filter(pl => pl.approx && pl.z === z); if (!list.length) return;
  const target = { n:`${ZN[z]} 식당가`, k:'🍽️', pos: Z[z] };
  L.marker(Z[z], { icon: L.divIcon({ className:'', html:`<div class="poi grp">🍽️<b>${list.length}</b></div>`, iconSize:[0,0] }), zIndexOffset:-400 })
    .bindPopup(() => popNav(`${ZN[z]} 식당 ${list.length}곳`, list.map(pl => pl.k + ' ' + pl.n).join('<br>') + '<br><i>구역 안 정확한 위치는 현장 안내판 확인</i>', target)).addTo(placeLayer);
});
const R = 6371000, rad = d => d * Math.PI / 180;
function distBear(a, b) {
  const [la1, lo1] = a.map(rad), [la2, lo2] = b.map(rad);
  const d = 2 * R * Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2));
  const y = Math.sin(lo2-lo1) * Math.cos(la2), x = Math.cos(la1)*Math.sin(la2) - Math.sin(la1)*Math.cos(la2)*Math.cos(lo2-lo1);
  return { d, b: (Math.atan2(y, x) * 180 / Math.PI + 360) % 360 };
}
const fmtD = d => d < 1000 ? Math.round(d) + 'm' : (d / 1000).toFixed(1) + 'km';
const myLL = () => myDot ? [myDot.getLatLng().lat, myDot.getLatLng().lng] : null;
let heading = null;   // 폰이 향한 방향(나침반). 있으면 화살표를 폰 기준으로 돌린다
function onOrient(e) {
  const h = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? 360 - e.alpha : null);
  if (h != null) { heading = h; updateNav(); }
}
async function enableCompass() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
      addEventListener('deviceorientation', onOrient);
    } else addEventListener('deviceorientationabsolute', onOrient);
  } catch {}
}
function renderEat() {
  const me = myLL();
  const list = PLACES.map(pl => ({ ...pl, db: me ? distBear(me, pl.pos) : null })).sort((a, b) => (a.db?.d ?? 0) - (b.db?.d ?? 0));
  $('sheetBody').innerHTML = `<h2>먹고쉬기</h2><p class="lead">${me ? '가까운 순 · 길안내를 누르면 화살표로 데려가요' : '위치를 허용하면 가까운 순으로 보여요'}</p>` +
    list.map(pl => `<div class="place"><div class="ic">${pl.k}</div><div class="nm">${pl.n}<small>${pl.t}${pl.h ? ' · ' + pl.h : ''}${pl.approx ? ' · 구역 위치(대략)' : ''}</small></div>
      ${pl.db ? `<div class="dir"><b style="transform:rotate(${pl.db.b - (heading ?? 0)}deg)">⬆</b><small>${fmtD(pl.db.d)}</small></div>` : ''}
      <button class="navgo" data-n="${pl.n}">길안내</button></div>`).join('') +
    `<p class="note">식당 목록·시간은 에버랜드 공식 매장 정보(10/28 기준)예요. 그날 쉬던 쿠치나 마리오·한가람은 뺐어요. 오늘(21일) 운영·라스트오더는 에버랜드 앱에서 한 번 더 확인하세요. '구역 위치(대략)'은 구역 한가운데로 안내해요. 화살표는 직선 방향이라 길 따라 조금 돌아갈 수 있어요.</p>`;
  $('sheetBody').querySelectorAll('.navgo').forEach(b => b.onclick = () => startNav(PLACES.find(p => p.n === b.dataset.n)));
}
let navTarget = null, navLine = null;
function startNav(pl) {
  if (!myLL()) return toast('내 위치를 찾는 중이에요… 위치 권한을 허용해 주세요');
  navTarget = pl; enableCompass(); openTab('map');
  $('navbar').classList.add('on'); $('crew').style.display = 'none';
  updateNav();
  map.flyToBounds([myLL(), pl.pos], { padding:[120,120], maxZoom:18 });
}
function updateNav() {
  if (!navTarget || !myLL()) return;
  const me = myLL(), { d, b } = distBear(me, navTarget.pos);
  if (navLine) navLine.setLatLngs([me, navTarget.pos]);
  else navLine = L.polyline([me, navTarget.pos], { color:'#2f80ff', weight:5, dashArray:'2 10', lineCap:'round' }).addTo(map);
  $('navTo').textContent = `${navTarget.k} ${navTarget.n}까지`;
  if (d < 25) { $('navDist').textContent = '도착! 🎉'; $('navCmp').textContent = ''; $('navArrow').querySelector('svg').style.transform = 'none'; return; }
  $('navDist').textContent = fmtD(d) + ' · 걸어서 ' + Math.max(1, Math.round(d / 70)) + '분';
  const rot = heading == null ? b : b - heading;
  $('navArrow').querySelector('svg').style.transform = `rotate(${rot}deg)`;
  $('navCmp').textContent = heading == null ? '화살표 위 = 지도 위쪽(북). 폰을 돌리면 맞춰지게 하려면 화살표를 눌러 나침반 허용' : '폰이 향한 방향 기준 화살표';
}
$('navArrow').onclick = enableCompass;
$('navX').onclick = () => { navTarget = null; $('navbar').classList.remove('on'); $('crew').style.display = ''; if (navLine) { map.removeLayer(navLine); navLine = null; } };
setInterval(updateNav, 2000);
</script>
